<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | Bible Quiz Challenge</title>
  
  <link rel="icon" type="image/avif" href="logo.avif">
  <link rel="apple-touch-icon" href="logo.avif">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=2.1.0">
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--color-bg);
      padding: 20px;
    }
    .login-container {
      width: 100%;
      max-width: 440px;
    }
    .login-card {
      background: #ffffff;
      border-radius: var(--radius-xl);
      padding: 32px 28px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
      border: 1px solid var(--color-border);
    }
    .login-header {
      text-align: center;
      margin-bottom: 24px;
    }
    .login-logo {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      object-fit: cover;
      margin: 0 auto 12px;
      display: block;
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.2);
    }
    .login-title {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--color-text-main);
      margin-bottom: 6px;
    }
    .login-subtitle {
      font-size: 0.9rem;
      color: var(--color-text-muted);
    }
    .login-footer-nav {
      margin-top: 20px;
      text-align: center;
    }
    .login-footer-nav a {
      color: var(--color-text-muted);
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 600;
      transition: color 0.2s;
    }
    .login-footer-nav a:hover {
      color: var(--color-primary);
    }
  </style>
</head>
<body>
  <!-- Floating Bible Elements in Background -->
  <div class="floating-elements-bg" aria-hidden="true">
    <div class="float-item float-1">🚢</div>
    <div class="float-item float-2">🕊️</div>
    <div class="float-item float-3">🦁</div>
    <div class="float-item float-6">📖</div>
    <div class="float-item float-9">👑</div>
  </div>

  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <img src="logo.avif" alt="Bible Quiz Logo" class="login-logo" />
        <h1 class="login-title">🔐 Admin Login</h1>
        <p class="login-subtitle">Sign in to manage and create custom Bible quizzes.</p>
      </div>

      <form id="admin-page-login-form" novalidate>
        <div class="input-group">
          <label for="admin-user-input"><strong>Username</strong></label>
          <input type="text" id="admin-user-input" placeholder="Enter username" autocomplete="username" required />
        </div>

        <div class="input-group">
          <label for="admin-pass-input"><strong>Password</strong></label>
          <input type="password" id="admin-pass-input" placeholder="••••••••" autocomplete="current-password" required />
        </div>

        <span id="admin-login-error" class="error-msg" aria-live="polite"></span>

        <div class="modal-actions" style="margin-top: 18px;">
          <button type="submit" id="submit-login-btn" class="btn btn-primary btn-lg" style="width: 100%;">
            Login to Admin Portal 🔓
          </button>
        </div>
      </form>

      <div class="modal-demo-hint" style="margin-top: 18px; text-align: center; font-size: 0.8rem; color: #64748b;">
        💡 <em>Client-side admin authentication. Sessions are verified securely in your browser.</em>
      </div>

      <div class="login-footer-nav">
        <a href="index.html">← Back to Quiz Home</a>
      </div>
    </div>
  </div>

  <script>
    const CONFIG = {
      STORAGE_KEY_ADMIN_SESSION: "BIBLE_QUIZ_ADMIN_AUTH"
    };
    const ADMIN_CREDENTIALS = {
      user: "admin",
      pass: "jesus"
    };

    // If already logged in, redirect straight to admin.html
    try {
      if (localStorage.getItem(CONFIG.STORAGE_KEY_ADMIN_SESSION) === "true") {
        window.location.replace("admin.html");
      }
    } catch (e) {}

    const form = document.getElementById("admin-page-login-form");
    const userInput = document.getElementById("admin-user-input");
    const passInput = document.getElementById("admin-pass-input");
    const errorEl = document.getElementById("admin-login-error");

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const user = userInput.value.trim();
      const pass = passInput.value.trim();

      if (user === ADMIN_CREDENTIALS.user && pass === ADMIN_CREDENTIALS.pass) {
        try {
          localStorage.setItem(CONFIG.STORAGE_KEY_ADMIN_SESSION, "true");
        } catch (err) {}
        window.location.href = "admin.html";
      } else {
        errorEl.textContent = "Invalid username or password. Please try again.";
        passInput.value = "";
        passInput.focus();
      }
    });
  </script>
</body>
</html>
